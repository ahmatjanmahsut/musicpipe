<!DOCTYPE html>
<html lang="zh-CN" data-scheme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MusicPipe 控制台</title>
<meta name="theme-color" content="#fafafa">
<!-- 反 FOUC 引导：必须在任何 <link rel="stylesheet"> 之前同步执行。
     只解析「跟随系统 / 深色 / 浅色」三态，把结果落到 html[data-scheme]，
     于是首帧就是正确明暗，不会闪一下再跳色（FRONTEND_GUIDE §2.1 双通道）。 -->
<script>
(function () {
  try {
    var d = document.documentElement;
    var pref = localStorage.getItem("mp.scheme");
    if (pref !== "dark" && pref !== "light") pref = "system";
    var dark = pref === "system"
      ? !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches)
      : pref === "dark";
    d.setAttribute("data-scheme", dark ? "dark" : "light");
  } catch (e) {}
})();
</script>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<!-- 正文字体走系统栈（-apple-system / PingFang SC / Noto Sans SC），零下载；
     只自托管一套等宽字体给数字与编号用，两个字重足够。 -->
<link rel="preload" href="/assets/fonts/jetbrains-mono-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="stylesheet" href="/css/pages.css">
</head>
<body>

<!-- 加载页与自定义光标已移除：控制台用真实骨架态代替"0→100 计数器"，
     指针保持系统默认（FRONTEND_GUIDE §0 让界面退到幕后）。 -->
<div id="app"></div>

<!-- ============ 模板 ============ -->

<script type="text/x-template" id="tpl-login">
<div class="page page--login">
  <div class="login__grid">
    <div class="login__scene">
      <div class="page__no">00 · CONSOLE</div>
      <h1 class="login__hero" v-if="isSetup"><span class="rv-line"><span>初始化控制台</span></span></h1>
      <h1 class="login__hero" v-else><span class="rv-line"><span>控制台登录</span></span></h1>
      <p class="lede">{{ isSetup ? '首次使用：创建管理员账号（与 App 共用同一账号体系）。管理员可登录控制台并管理全部功能；普通用户仅能登录 App。' : '仅限管理员账号登录。账号与 MusicPipe App 通用。' }}</p>
    </div>
    <form class="login__card" @submit.prevent="submit" novalidate>
      <div class="field">
        <label class="field__lb" for="lg-user">用户名</label>
        <input class="inp" id="lg-user" v-model="username" autocomplete="username" :disabled="loading" @keyup.enter="submit">
      </div>
      <div class="field">
        <label class="field__lb" for="lg-pass">密码</label>
        <div class="login__pwd">
          <input class="inp" id="lg-pass" :type="showPwd ? 'text' : 'password'" :placeholder="isSetup ? '密码（至少6位）' : '密码'" autocomplete="current-password" v-model="password" :disabled="loading" @keyup.enter="submit">
          <button type="button" class="btn btn--icon login__eye" :aria-label="showPwd ? '隐藏密码' : '显示密码'" tabindex="-1" @click="showPwd = !showPwd"><i v-ic="showPwd ? 'eye-off' : 'eye'"></i></button>
        </div>
      </div>
      <div class="field__err" v-if="error">{{ error }}</div>
      <button type="submit" class="btn btn--cta login__submit" :disabled="loading" :data-loading="loading ? 'true' : 'false'" data-cursor="Go">{{ isSetup ? '创建并进入' : '登录' }}</button>
    </form>
  </div>
</div>
</script>

<script type="text/x-template" id="tpl-dashboard">
<div class="page">
  <div class="page__hero">
    <div class="page__no">01</div>
    <h1><span class="rv-line"><span>概览</span></span></h1>
    <p class="lede">系统状态与事件流 · 8 秒自动刷新。</p>
  </div>
  <div class="page__body dash__body">
    <section class="sect dash__stats">
      <div class="stat stat--hero">
        <div class="stat__lbl">库内曲目</div>
        <div class="stat__num t-mono" v-count="counts.tracks || 0">0</div>
        <div class="stat__sub"><span class="bar stat__bar"><span class="bar__fill" :style="{ '--bar-w': importedRatio }"></span></span><span>已入库 <b class="t-mono" v-count="counts.tracks_imported || 0">0</b> / {{ counts.tracks || 0 }}</span></div>
      </div>
      <div class="stat stat--tile">
        <div class="stat__lbl">已入库</div>
        <div class="stat__num t-mono" v-count="counts.tracks_imported || 0">0</div>
      </div>
      <div class="stat stat--tile">
        <div class="stat__lbl">进行中任务</div>
        <div class="stat__num t-mono" v-count="counts.tasks_running || 0">0</div>
        <div class="stat__sub">实时同步</div>
      </div>
      <div class="stat stat--tile">
        <div class="stat__lbl">今日下载</div>
        <div class="stat__num t-mono" v-count="counts.today_downloads || 0">0</div>
      </div>
      <div class="stat stat--disk">
        <div class="stat__lbl">磁盘（挂载视图）</div>
        <div class="stat__num t-mono"><span v-count="pctNum">-</span><span v-if="pctNum !== null">%</span></div>
        <div class="bar disk__bar"><span class="bar__fill" :style="{ '--bar-w': diskRatio }"></span></div>
        <div class="stat__sub">剩余 {{ gb(disk.free) }} / {{ gb(disk.total) }}</div>
      </div>
    </section>

    <section class="sect dash__lower">
      <div class="dash__services">
        <h2 class="sect__h">服务状态</h2>
        <div class="table-wrap">
          <table class="mp-table">
            <thead><tr><th scope="col">服务</th><th scope="col">状态</th><th scope="col">详情</th></tr></thead>
            <tbody>
              <tr v-for="s in serviceRows" :key="s.name">
                <td data-label="服务">{{ s.name }}</td>
                <td data-label="状态"><span class="dot" :class="s.ok ? 'dot--ok' : 'dot--bad'"></span>{{ s.ok ? '正常' : '异常' }}</td>
                <td class="t-mono cell-dim" data-label="详情">{{ s.info }}</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
      <aside class="dash__feed">
        <h2 class="sect__h">最近事件</h2>
        <div class="feed">
          <div class="feed__row" v-for="e in events" :key="e.id">
            <span class="t-mono">{{ fmt(e.created_at) }}</span>
            <span class="feed__kind tag tag--info">{{ e.kind }}</span>
            <span class="feed__detail">{{ clip(e.detail) }}</span>
          </div>
          <div class="hint" v-if="!events.length">暂无事件</div>
        </div>
      </aside>
    </section>
  </div>
</div>
</script>

<script type="text/x-template" id="tpl-search">
<div class="page">
  <div class="page__hero">
    <div class="page__no">02</div>
    <h1><span class="rv-line"><span>全平台搜索</span></span></h1>
    <p class="lede">一个关键词，多平台并发应答；选中即入队下载。</p>
  </div>
  <div class="page__body">
    <div class="bar-tools">
      <input class="inp search__kw" v-model="keyword" placeholder="搜索歌曲，回车同时查询全部平台" @keyup.enter="doSearch">
      <div class="field search__q">
        <label class="field__lb" for="sq-quality">音质</label>
        <select class="sel" id="sq-quality" v-model="quality">
          <option value="auto">最高(自动)</option>
          <option value="flac">FLAC无损</option>
          <option value="320k">320k</option>
          <option value="128k">128k</option>
        </select>
      </div>
      <button class="btn btn--cta" :disabled="loading" :data-loading="loading ? 'true' : 'false'" data-cursor="Go" @click="doSearch"><i v-ic="'search'"></i>搜索全部平台</button>
      <button class="btn" :disabled="!sel.length" @click="downloadSelected"><i v-ic="'download'"></i>下载选中({{ sel.length }})</button>
    </div>
    <div class="hint search__tip">{{ tip }}</div>
    <div class="tabs" role="tablist">
      <button class="tab" :class="{ 'tab--on': tab === 'all' }" role="tab" :aria-selected="tab === 'all'" @click="tab = 'all'">全部<span class="tab__n" v-if="allRows.length">{{ allRows.length }}</span></button>
      <button class="tab" :class="{ 'tab--on': tab === r.platform }" role="tab" :aria-selected="tab === r.platform" v-for="r in results" :key="r.platform" @click="tab = r.platform">{{ r.name }}<span class="tab__n">{{ r.loading ? '…' : (r.ok ? r.count : '失败') }}</span></button>
    </div>
    <div class="table-wrap">
      <table class="mp-table" :class="{ 'mp-table--busy': loading }">
        <thead>
          <tr>
            <th scope="col" class="col-ck"><input type="checkbox" class="ck" aria-label="全选本页" :checked="allSel" v-indet="partialSel" @change="toggleAll"></th>
            <th scope="col">平台</th>
            <th scope="col">歌曲</th>
            <th scope="col">歌手</th>
            <th scope="col">专辑</th>
            <th scope="col">时长</th>
            <th scope="col">可选音质</th>
            <th scope="col">操作</th>
          </tr>
        </thead>
        <tbody>
          <tr v-for="row in shown" :key="row.rowid">
            <td class="col-ck" data-label="选择"><input type="checkbox" class="ck" :value="row" v-model="sel" :aria-label="'选择 ' + row.name"></td>
            <td data-label="平台"><span class="tag" :class="'tag--' + platTag(row.source)">{{ platName(row.source) }}</span></td>
            <td class="cell-main" data-label="歌曲">{{ row.name }}</td>
            <td data-label="歌手">{{ row.singer }}</td>
            <td class="cell-album" :title="row.album" data-label="专辑">{{ row.album }}</td>
            <td class="t-mono" data-label="时长">{{ dur(row.duration) }}</td>
            <td class="t-mono" data-label="可选音质">{{ fmtTypes(row) }}</td>
            <td data-label="操作"><button class="btn btn--icon" data-cursor="Go" title="下载" @click="dlOne(row)"><i v-ic="'download'"></i></button></td>
          </tr>
          <tr v-if="!shown.length && !loading"><td class="cell-empty" colspan="8" data-label="选择">无结果 · 换个关键词或翻页</td></tr>
        </tbody>
      </table>
    </div>
    <div class="pager search__pager">
      <button class="pager__btn" :disabled="page <= 1 || loading" @click="page--; doSearch()"><i class="i-arrow" v-ic="'chevron-left'"></i>上一页</button>
      <span class="pager__cur">第 {{ page }} 页</span>
      <button class="pager__btn" :disabled="loading" @click="page++; doSearch()">下一页<i class="i-arrow" v-ic="'chevron-right'"></i></button>
    </div>
  </div>
</div>
</script>

<script type="text/x-template" id="tpl-tasks">
<div class="page">
  <div class="page__hero">
    <div class="page__no">03</div>
    <h1><span class="rv-line"><span>下载任务</span></span></h1>
    <p class="lede">队列进度、速度与失败重试 · 5 秒轮询 + WS 实时触发。</p>
  </div>
  <div class="page__body">
    <div class="bar-tools">
      <button class="btn" @click="load"><i v-ic="'refresh-cw'"></i>刷新</button>
      <button class="btn" @click="onlyFailed">{{ onlyF ? '查看全部' : '只看失败' }}</button>
      <button class="btn" :disabled="!sel.length" @click="bulkCancel"><i v-ic="'ban'"></i>取消选中({{ sel.length }})</button>
      <button class="btn btn--danger" :disabled="!sel.length" @click="bulkDel"><i v-ic="'trash-2'"></i>删除选中记录({{ sel.length }})</button>
      <button class="btn btn--danger btn--ghost" @click="clearFin"><i v-ic="'trash-2'"></i>清除已完成</button>
      <span class="hint">勾选行可批量取消/删除</span>
    </div>
    <div class="table-wrap">
      <table class="mp-table">
        <thead>
          <tr>
            <th scope="col" class="col-ck"><input type="checkbox" class="ck" aria-label="全选" :checked="allSel" v-indet="partialSel" @change="toggleAll"></th>
            <th scope="col">ID</th>
            <th scope="col">类型</th>
            <th scope="col">状态</th>
            <th scope="col">进度</th>
            <th scope="col">信息</th>
            <th scope="col">速度</th>
            <th scope="col">错误</th>
            <th scope="col">操作</th>
          </tr>
        </thead>
        <tbody>
          <tr v-for="t in shownList" :key="t.id">
            <td class="col-ck" data-label="选择"><input type="checkbox" class="ck" :value="t" v-model="sel" :aria-label="'选择任务 ' + t.id"></td>
            <td class="t-mono" data-label="ID">{{ t.id }}</td>
            <td data-label="类型">{{ t.type }}</td>
            <td data-label="状态"><span class="dot" :class="taskDot(t.status)"></span>{{ t.status }}</td>
            <td class="cell-progress" data-label="进度">
              <div class="bar bar--row" :class="{ 'bar--err': t.status === 'failed', 'bar--ok': t.progress >= 100 }" :style="{ '--bar-w': (t.progress || 0) / 100 }"><span class="bar__fill"></span></div>
              <span class="t-mono bar__pct">{{ t.progress || 0 }}%</span>
            </td>
            <td class="cell-main" data-label="信息">{{ t.message }}</td>
            <td class="t-mono" data-label="速度">{{ t.speed ? mb(t.speed) + '/s' : '-' }}</td>
            <td class="t-mono cell-dim" data-label="错误">{{ clip(t.error) }}</td>
            <td class="cell-actions" data-label="操作">
              <button class="btn btn--icon" v-if="t.status === 'failed'" title="重试" data-cursor="Go" @click="retry(t.id)"><i v-ic="'rotate-ccw'"></i></button>
              <button class="btn btn--icon" v-if="cancellable(t.status)" title="取消" data-cursor="Go" @click="cancel(t.id)"><i v-ic="'ban'"></i></button>
            </td>
          </tr>
          <tr v-if="!shownList.length"><td class="cell-empty" colspan="9" data-label="选择">{{ onlyF ? '没有失败或取消的任务' : '队列为空' }}</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
</script>

<script type="text/x-template" id="tpl-tracks">
<div class="page">
  <div class="page__hero">
    <div class="page__no">04</div>
    <h1><span class="rv-line"><span>音乐库</span></span></h1>
    <p class="lede">网盘曲库索引：预览、整理、刮削与删除。</p>
  </div>
  <div class="page__body">
    <div class="bar-tools">
      <input class="inp tracks__q" v-model="q" placeholder="搜索库内曲目" @keyup.enter="load">
      <button class="btn btn--cta" @click="load"><i v-ic="'search'"></i>查询</button>
      <button class="btn" @click="goOrganize"><i v-ic="'folder'"></i>去整理页</button>
      <button class="btn btn--danger" :disabled="!sel.length" @click="bulkDel"><i v-ic="'trash-2'"></i>批量删除({{ sel.length }})</button>
    </div>
    <div class="table-wrap">
      <table class="mp-table">
        <thead>
          <tr>
            <th scope="col" class="col-ck"><input type="checkbox" class="ck" aria-label="全选" :checked="allSel" v-indet="partialSel" @change="toggleAll"></th>
            <th scope="col">标题</th>
            <th scope="col">歌手</th>
            <th scope="col">专辑</th>
            <th scope="col">音质</th>
            <th scope="col">状态</th>
            <th scope="col">网盘路径</th>
            <th scope="col">大小</th>
            <th scope="col">操作</th>
          </tr>
        </thead>
        <tbody>
          <tr v-for="t in list" :key="t.id">
            <td class="col-ck" data-label="选择"><input type="checkbox" class="ck" :value="t" v-model="sel" :aria-label="'选择 ' + t.title"></td>
            <td class="cell-main" data-label="标题">{{ t.title }}</td>
            <td data-label="歌手">{{ t.artist }}</td>
            <td data-label="专辑">{{ t.album }}</td>
            <td class="t-mono" data-label="音质">{{ t.quality }}</td>
            <td data-label="状态"><span class="tag" :class="'tag--' + trackTag(t.status)">{{ t.status }}</span></td>
            <td class="t-mono cell-path" :title="t.remote_path" data-label="网盘路径">{{ t.remote_path }}</td>
            <td class="t-mono" data-label="大小">{{ mb(t.file_size) }}</td>
            <td class="cell-actions" data-label="操作">
              <button class="btn btn--icon" title="预览" data-cursor="Open" @click="play(t.id)"><i v-ic="'play'"></i></button>
              <button class="btn btn--icon" v-if="t.status === 'uploaded'" title="整理" data-cursor="Go" @click="organize(t.id)"><i v-ic="'folder'"></i></button>
              <button class="btn btn--icon" title="刮削" :disabled="scraping === t.id" :data-loading="scraping === t.id ? 'true' : 'false'" data-cursor="Go" @click="scrape(t.id)"><i v-ic="'sparkles'"></i></button>
              <button class="btn btn--icon btn--danger" title="删除" data-cursor="Go" @click="del(t.id)"><i v-ic="'trash-2'"></i></button>
            </td>
          </tr>
          <tr v-if="!list.length"><td class="cell-empty" colspan="9" data-label="选择">库内暂无曲目</td></tr>
        </tbody>
      </table>
    </div>

    <mp-modal v-if="dlg" title="试听" @close="dlg = false">
      <div class="modal__audio">
        <audio controls autoplay :src="audiosrc" v-if="audiosrc"></audio>
        <p class="hint">预览由控制台经 WebDAV 流式转发，不暴露网盘地址</p>
      </div>
    </mp-modal>
  </div>
</div>
</script>

<script type="text/x-template" id="tpl-shares">
<div class="page">
  <div class="page__hero">
    <div class="page__no">06</div>
    <h1><span class="rv-line"><span>分享歌单</span></span></h1>
    <p class="lede">订阅制歌单：解析预览、同步补下、暂停退订。</p>
  </div>
  <div class="page__body">
    <div class="bar-tools">
      <input class="inp shares__url" v-model="url" placeholder="粘贴网易云音乐或QQ音乐的「歌单分享链接」(支持短链)" @keyup.enter="add">
      <button class="btn btn--cta" :disabled="adding" :data-loading="adding ? 'true' : 'false'" data-cursor="Go" @click="add"><i v-ic="'link'"></i>解析预览</button>
      <button class="btn" @click="load"><i v-ic="'refresh-cw'"></i>刷新列表</button>
    </div>
    <div class="hint">订阅流程为两步：解析预览 → 核对分享用户与曲目 → 点「开始下载」。已订阅歌单每天自动重新解析，新增歌曲自动补下（与源歌单保持一致）。</div>
    <div class="table-wrap">
      <table class="mp-table">
        <thead>
          <tr>
            <th scope="col">歌单</th>
            <th scope="col">音质</th>
            <th scope="col">曲目</th>
            <th scope="col">状态</th>
            <th scope="col">最近结果</th>
            <th scope="col">操作</th>
          </tr>
        </thead>
        <tbody>
          <tr v-for="s in list" :key="s.id">
            <td class="cell-main" data-label="歌单">
              <b>{{ s.title }}</b>
              <div class="hint shares__sub"><i class="i-arrow" v-ic="'link'"></i>分享用户: {{ s.share_user }} · {{ s.platform === 'wy' ? '网易云' : 'QQ音乐' }}</div>
            </td>
            <td class="t-mono" data-label="音质">{{ s.quality }}</td>
            <td class="t-mono" data-label="曲目">{{ s.in_library }}/{{ s.song_count }}</td>
            <td data-label="状态"><span class="tag" :class="'tag--' + shareTag(s.status)">{{ shareLabel(s.status) }}</span></td>
            <td data-label="最近结果"><span class="hint">{{ s.last_result }}</span></td>
            <td class="cell-actions" data-label="操作">
              <button class="btn" data-cursor="Open" @click="openPreview(s)">{{ s.status === 'pending' ? '预览下载' : '预览' }}</button>
              <button class="btn" v-if="s.status !== 'pending'" :disabled="busy === s.id" :data-loading="busy === s.id ? 'true' : 'false'" @click="sync(s)">同步</button>
              <button class="btn" v-if="s.status !== 'pending'" @click="toggle(s)">{{ s.status === 'paused' ? '恢复' : '暂停' }}</button>
              <button class="btn btn--danger btn--ghost" @click="del(s)">退订</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
    <div class="empty" v-if="!list.length">
      <p>暂无订阅。从手机网易云/QQ音乐App分享一个歌单链接粘贴到上方即可。</p>
    </div>

    <mp-modal v-if="pv" wide :title="prev.link ? ('歌单预览 · ' + prev.link.title) : '预览'" @close="pv = false">
      <div class="pv__toolbar" v-if="prev.link">
        <div class="field pv__user-f">
          <label class="field__lb" for="pv-user">分享用户</label>
          <input class="inp" id="pv-user" v-model="pvUser">
        </div>
        <span class="hint">{{ prev.link.user_id ? '（专辑将按此名称创建；解析值(链接指定分享者uid:' + prev.link.user_id + ')如有出入请直接修改）' : '（专辑将按此名称创建；解析值(取歌单创建者)如有出入请直接修改）' }}</span>
        <div class="field pv__q-f">

      <div class="field"><label class="field__lb" for="rl-name">版本名</label><input class="inp" id="rl-name" v-model="form.versionName" placeholder="如 1.1.0"></div>
      <div class="field">
        <label class="field__lb" for="rl-code">版本号</label>
        <div class="num num--code">
          <input class="num__inp" id="rl-code" type="number" v-model.number="form.versionCode" min="1" step="1">
          <button class="num__btn num__btn--dec" aria-label="减少" @click="stepCode(-1)"><i v-ic="'plus'"></i></button>
          <button class="num__btn num__btn--inc" aria-label="增加" @click="stepCode(1)"><i v-ic="'plus'"></i></button>
        </div>
        <span class="hint">整数，需大于现有最大</span>
      </div>
      <div class="field">
        <label class="field__lb" for="rl-file">APK 文件</label>
        <input type="file" id="rl-file" ref="file" accept=".apk" class="src__file" @change="onFile">
        <div class="bar-tools">
          <button class="btn" type="button" @click="$refs.file.click()"><i v-ic="'file-archive'"></i>选择文件</button>
          <span class="hint">{{ fileName || '未选择（≤300MB，.apk）' }}</span>
        </div>
      </div>
      <div class="field"><label class="field__lb" for="rl-log">更新说明</label><textarea class="ta" id="rl-log" rows="3" v-model="form.changelog" placeholder="本次更新内容（可选）"></textarea></div>
      <template #foot>
        <button class="btn" @click="dlg = false">取消</button>
        <button class="btn btn--cta" :disabled="!picked || uploading" :data-loading="uploading ? 'true' : 'false'" @click="upload">上传发布</button>
      </template>
    </mp-modal>
  </div>
</div>
</script>

<script type="text/x-template" id="tpl-shell">
<div class="shell">
  <header class="nav" ref="nav">
    <a class="nav__wordmark" href="#dashboard" data-magnet data-cursor="Go" @click="go('dashboard')">MusicPipe</a>
    <span class="nav__now">{{ navNow }}</span>
    <nav aria-label="主导航">
      <a v-for="(m, i) in menus" :key="m.k" class="nav__link" :class="{ 'nav__link--active': route === m.k }" :href="'#' + m.k" @click="go(m.k)">
        <span class="nav__idx">{{ String(i + 1).padStart(2, '0') }}</span>
        <i class="i-arrow" v-ic="m.icon"></i>
        <span class="nav__txt">{{ m.label }}</span>
      </a>
    </nav>
    <span class="nav__ws"><span class="dot" :class="wsOk ? 'dot--ok' : 'dot--bad'"></span><span class="nav__ws-txt">{{ wsOk ? '实时连接' : '连接断开' }}</span></span>
    <span class="nav__user" v-if="who"><i class="i-arrow" v-ic="'user'"></i>{{ who }}（管理员）</span>
    <a class="nav__out" @click="logout"><i class="i-arrow" v-ic="'log-out'"></i>退出</a>
    <button type="button" class="nav__toggle" ref="toggle" :aria-expanded="navOpen ? 'true' : 'false'" aria-controls="mp-navmenu" @click="toggleNav"><i class="i-arrow" v-ic="'menu'"></i><span class="nav__toggle-txt">菜单</span></button>
  </header>

  <!-- 窄屏全屏导航抽屉：10 项一次看全（桌面导航条在 ≤760px 折叠到这里，不再横向滚动裁切） -->
  <div class="navmenu" :class="{ 'navmenu--open': navOpen }" :aria-hidden="navOpen ? 'false' : 'true'">
    <div class="navmenu__panel" id="mp-navmenu" role="dialog" aria-modal="true" aria-label="主导航">
      <div class="navmenu__head">
        <span class="navmenu__brand">MusicPipe · 导航</span>
        <button type="button" class="btn btn--icon" aria-label="关闭菜单" @click="closeNav"><i v-ic="'x'"></i></button>
      </div>
      <nav class="navmenu__list" aria-label="主导航（移动端）">
        <a v-for="(m, i) in menus" :key="'nm-' + m.k" class="navmenu__link" :class="{ 'navmenu__link--active': route === m.k }" :href="'#' + m.k" @click="go(m.k)" @keydown.esc="closeNav">
          <span class="navmenu__idx">{{ String(i + 1).padStart(2, '0') }}</span>
          <i class="i-arrow" v-ic="m.icon"></i>
          <span class="navmenu__txt">{{ m.label }}</span>
        </a>
      </nav>
      <div class="navmenu__foot">
        <span class="navmenu__ws"><span class="dot" :class="wsOk ? 'dot--ok' : 'dot--bad'"></span>{{ wsOk ? '实时连接' : '连接断开' }}</span>
        <span class="navmenu__user" v-if="who"><i class="i-arrow" v-ic="'user'"></i>{{ who }}</span>
        <a class="navmenu__out" @click="logout"><i class="i-arrow" v-ic="'log-out'"></i>退出登录</a>
      </div>
    </div>
  </div>
  <main>
    <component :is="'page-' + route"></component>
  </main>
  <footer class="foot">
    <div class="foot__meta"><span>MusicPipe Console · music.example.com</span><span class="t-mono">{{ year }}</span></div>
  </footer>
</div>
</script>

<script type="text/x-template" id="tpl-modal">
<div class="mp-modal" @keydown.esc.stop="$emit('close')" tabindex="-1" ref="panel">
  <div class="mp-modal__scrim" @click="$emit('close')"></div>
  <div class="mp-modal__panel" :class="{ 'mp-modal__panel--wide': wide }" role="dialog" aria-modal="true">
    <div class="mp-modal__head">
      <span class="mp-modal__title">{{ title }}</span>
      <button class="btn btn--icon" aria-label="关闭" @click="$emit('close')"><i v-ic="'x'"></i></button>
    </div>
    <div class="mp-modal__body"><slot></slot></div>
    <div class="mp-modal__foot"><slot name="foot"></slot></div>
  </div>
</div>
</script>

<script type="text/x-template" id="tpl-toasts">
<div class="mp-toast" aria-live="polite">
  <div class="mp-toast__item" :class="'mp-toast__item--' + t.kind" v-for="t in list" :key="t.id" :data-tid="t.id">
    <i class="i-arrow" v-ic="t.kind === 'ok' ? 'circle-check' : (t.kind === 'warn' ? 'triangle-alert' : 'circle-alert')"></i>
    <span>{{ t.msg }}</span>
  </div>
</div>
</script>

<script src="/vendor/vue.global.prod.js"></script>
<script src="/assets/icons.js"></script>
<script src="/app.js"></script>
</body>
</html>
